<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>行列のできるラーメン店</title>
<link rel="stylesheet" href="style.css?v=20261106020325">
</head>
<body>
<div id="game">
  <!-- ヘッダー -->
  <header id="hud">
    <div class="hud-item">🕐 <span id="clock">11:00</span></div>
    <div class="hud-item">💴 <span id="money">¥0</span></div>
    <div class="hud-item"><span id="lblRep">評判</span> <span id="rep">★★★☆☆</span></div>
    <div class="hud-item"><span id="lblLine">行列</span> <span id="qcount">0</span><span id="lblPpl">人</span></div>
    <div class="hud-item"><span id="lblTrash">ゴミ</span> <span id="garbage">0</span></div>
    <button id="bgmBtn" class="hud-btn" type="button">🎵 BGM ON</button>
    <button id="pauseBtn" class="hud-btn" type="button" aria-label="pause">⏸</button>
  </header>

  <!-- 客席側（奥） -->
  <section id="shop">
    <!-- 昭和の中華屋の壁：短冊メニュー・時計・日めくり・貼り紙 -->
    <div id="wall">
      <div class="menu-rail"></div>
      <div id="menulist"></div>
      <div class="wall-clock" aria-hidden="true"><div class="hand h"></div><div class="hand m"></div></div>
      <div class="himekuri" aria-hidden="true"><div class="hm-top">昭和</div><div class="hm-day">5</div><div class="hm-week">土曜日</div></div>
      <!-- 昭和のビールのポスター（オリジナルのイラスト。実在の銘柄は出さない） -->
      <div class="beer-poster" aria-hidden="true">
        <svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bpPool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc8f0"/><stop offset="1" stop-color="#1f8fd0"/></linearGradient>
            <linearGradient id="bpBeer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98a14"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#c97a10"/></linearGradient>
            <linearGradient id="bpSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9b68f"/><stop offset=".5" stop-color="#f6cfac"/><stop offset="1" stop-color="#e2ab84"/></linearGradient>
          </defs>
          <!-- プールの水面とゆらぐ光 -->
          <rect width="120" height="170" fill="url(#bpPool)"/>
          <g stroke="#e8f8ff" stroke-width="1.2" fill="none" opacity=".55">
            <path d="M0 18 q10 -4 20 0 t20 0 t20 0"/><path d="M50 40 q10 -4 20 0 t20 0"/><path d="M4 62 q10 -4 20 0 t20 0"/><path d="M60 78 q10 -4 20 0 t20 0 t20 0"/>
          </g>
          <!-- プールサイド（タイル） -->
          <path d="M0 120 L120 112 L120 170 L0 170Z" fill="#f3f1ea"/>
          <path d="M0 120 L120 112" stroke="#c9d6dc" stroke-width="2"/>
          <g stroke="#dcdcd4" stroke-width=".8"><path d="M0 138 L120 132 M0 156 L120 151 M30 118 L28 170 M60 116 L60 170 M90 114 L92 170"/></g>
          <!-- 髪（うしろ） -->
          <path d="M30 46 Q26 18 50 14 Q74 14 72 42 Q76 68 66 80 L36 80 Q26 66 30 46Z" fill="#2a1a10"/>
          <!-- 脚（プールサイドに横すわり） -->
          <path d="M44 118 Q70 112 98 124 Q104 128 100 132 Q74 128 48 134Z" fill="url(#bpSkin)"/>
          <path d="M46 126 Q72 126 94 140 Q98 144 93 146 Q70 138 46 138Z" fill="url(#bpSkin)"/>
          <!-- 体 -->
          <path d="M38 84 Q40 72 52 70 Q64 72 66 84 L68 118 Q54 126 38 120Z" fill="url(#bpSkin)"/>
          <path d="M44 66 L60 66 L58 74 L46 74Z" fill="url(#bpSkin)"/>
          <!-- 青いビキニ -->
          <path d="M40 86 Q46 82 51 88 Q56 82 64 86 Q63 94 58 95 Q53 96 51 92 Q49 96 44 95 Q39 94 40 86Z" fill="#1f4fc0"/>
          <path d="M44 84 L46 74 M60 84 L58 74" stroke="#1f4fc0" stroke-width="1.3"/>
          <path d="M39 112 Q53 118 67 112 L66 120 Q53 126 40 120Z" fill="#1f4fc0"/>
          <!-- 腕（ジョッキを掲げる） -->
          <path d="M40 90 Q28 92 24 78" stroke="#f0c39e" stroke-width="6.5" fill="none" stroke-linecap="round"/>
          <path d="M65 92 Q74 104 70 114" stroke="#f0c39e" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- ジョッキ -->
          <rect x="10" y="52" width="22" height="28" rx="3" fill="url(#bpBeer)" stroke="#fff" stroke-width="1.2"/>
          <path d="M10 58 q-8 0 -8 9 t8 9" stroke="#fff" stroke-width="2.6" fill="none"/>
          <path d="M8 54 q3 -8 9 -5 q4 -6 10 -1 q6 -2 6 5 Z" fill="#fffdf3"/>
          <g fill="#fff" opacity=".7"><circle cx="16" cy="68" r="1.2"/><circle cx="23" cy="74" r="1"/><circle cx="26" cy="63" r="1.1"/></g>
          <!-- 顔 -->
          <ellipse cx="52" cy="46" rx="15" ry="17" fill="#f6cfac"/>
          <path d="M37 44 Q38 24 52 24 Q67 24 67 44 Q62 32 52 34 Q42 32 37 44Z" fill="#2a1a10"/>
          <path d="M37 44 Q34 58 40 66" stroke="#2a1a10" stroke-width="4" fill="none"/>
          <path d="M45 46 q3 -3 6 0 M54 46 q3 -3 6 0" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="44" cy="52" rx="2.6" ry="1.6" fill="#ff8a8a" opacity=".5"/><ellipse cx="61" cy="52" rx="2.6" ry="1.6" fill="#ff8a8a" opacity=".5"/>
          <path d="M48 55 Q52 60 57 55" stroke="#b3261e" stroke-width="1.6" fill="#fff" stroke-linejoin="round"/>
          <circle cx="66" cy="34" r="2.6" fill="#fff"/><circle cx="68" cy="31" r="1.6" fill="#ffd0e0"/>
          <!-- キャッチコピー（縦書きの黒い帯） -->
          <rect x="94" y="6" width="22" height="78" fill="#111"/>
          <g font-size="12" font-weight="bold" fill="#fff" font-family="sans-serif" text-anchor="middle">
            <text x="105" y="21">よ</text><text x="105" y="34">く</text><text x="105" y="47">冷</text><text x="105" y="60">え</text><text x="105" y="73">た</text>
          </g>
          <g font-size="6" fill="#fff" font-family="sans-serif" text-anchor="middle"><text x="105" y="81">、生。</text></g>
          <!-- 商品名（架空） -->
          <rect x="0" y="146" width="120" height="24" fill="#c0201a"/>
          <rect x="84" y="140" width="32" height="12" fill="#c0201a" stroke="#fff" stroke-width=".8"/>
          <text x="100" y="149" font-size="7.5" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">樽生</text>
          <text x="60" y="163" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif" letter-spacing=".5">ラーメン横丁ビール</text>
        </svg>
      </div>
      <div class="harigami" aria-hidden="true">冷やし中華<br>はじめました</div>
    </div>
    <div id="entrance">
      <div class="noren"><span>中</span><span>華</span><span>そ</span><span>ば</span></div>
    </div>
    <!-- 行列：席の後ろに立って並ぶお客さん -->
    <div id="queue"></div>
    <div id="seats"></div>
    <div id="counter"></div>
  </section>

  <!-- 厨房（手前） -->
  <section id="kitchen">
    <div id="toast"></div>
    <!-- リワード広告：怒って帰ったお客さんを呼び戻す（アプリのみ） -->
    <button id="recallBtn" type="button" hidden></button>
    <div class="k-block boiler-block">
      <div id="cups"></div>
      <div id="boilers"></div>
    </div>
    <div class="k-block bowl-block">
      <div id="bowlArea"></div>
    </div>
    <div class="k-block side-block">
      <div id="ingredients"></div>
    </div>
  </section>

  <!-- オーバーレイ -->
  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>
<!-- three.js（MIT License）を同梱。アプリはオフラインで遊べる -->
<script src="vendor/three.min.js"></script>
<script src="build-info.js?v=20261106020325"></script>
<script src="ads-config.js?v=20261106020325"></script>
<script src="ads.js?v=20261106020325"></script>
<script src="bowl3d.js?v=20261106020325"></script>
<script src="bgm.js?v=20261106020325"></script>
<script src="game.js?v=20261106020325"></script>
</body>
</html>
