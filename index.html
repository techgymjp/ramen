<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>行列のできるラーメン店</title>
<link rel="stylesheet" href="style.css?v=20261107094738">
</head>
<body>
<div id="game">
  <!-- ヘッダー -->
  <header id="hud">
    <div class="hud-item">🕐 <span id="clock">11:00</span></div>
    <div class="hud-item">💴 <span id="money">¥0</span></div>
    <div class="hud-item"><span id="lblRep">評判</span> <span id="rep">★★★☆☆</span></div>
    <div class="hud-item"><span id="lblLine">行列</span> <span id="qcount">0</span><span id="lblPpl">人</span></div>
    <div class="hud-item"><span id="lblTrash">ゴミ</span> <span id="garbage">0</span></div>
    <button id="bgmBtn" class="hud-btn" type="button">🎵 BGM ON</button>
    <button id="pauseBtn" class="hud-btn" type="button" aria-label="pause">⏸</button>
  </header>

  <!-- 客席側（奥） -->
  <section id="shop">
    <!-- 昭和の中華屋の壁：短冊メニュー・時計・日めくり・貼り紙 -->
    <div id="wall">
      <div class="menu-rail"></div>
      <div id="menulist"></div>
      <div class="wall-clock" aria-hidden="true"><div class="hand h"></div><div class="hand m"></div></div>
      <div class="himekuri" aria-hidden="true"><div class="hm-top">昭和</div><div class="hm-day">5</div><div class="hm-week">土曜日</div></div>
      <!-- 昭和のビールのポスター 3 枚（オリジナルのイラスト。実在の広告・銘柄・人物は使わない） -->
      <div class="posters" aria-hidden="true">
        <div class="beer-poster p1">
        <svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bpPool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc8f0"/><stop offset="1" stop-color="#1f8fd0"/></linearGradient>
            <linearGradient id="bpBeer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98a14"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#c97a10"/></linearGradient>
            <linearGradient id="bpSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9b68f"/><stop offset=".5" stop-color="#f6cfac"/><stop offset="1" stop-color="#e2ab84"/></linearGradient>
          </defs>
          <!-- プールの水面とゆらぐ光 -->
          <rect width="120" height="170" fill="url(#bpPool)"/>
          <g stroke="#e8f8ff" stroke-width="1.2" fill="none" opacity=".55">
            <path d="M0 18 q10 -4 20 0 t20 0 t20 0"/><path d="M50 40 q10 -4 20 0 t20 0"/><path d="M4 62 q10 -4 20 0 t20 0"/><path d="M60 78 q10 -4 20 0 t20 0 t20 0"/>
          </g>
          <!-- プールサイド（タイル） -->
          <path d="M0 120 L120 112 L120 170 L0 170Z" fill="#f3f1ea"/>
          <path d="M0 120 L120 112" stroke="#c9d6dc" stroke-width="2"/>
          <g stroke="#dcdcd4" stroke-width=".8"><path d="M0 138 L120 132 M0 156 L120 151 M30 118 L28 170 M60 116 L60 170 M90 114 L92 170"/></g>
          <!-- 髪（うしろ・肩までのボブ） -->
          <path d="M33 40 Q31 16 52 14 Q72 15 71 40 Q73 58 66 66 L38 66 Q31 56 33 40Z" fill="#2a1a10"/>
          <!-- 体（プールのふちに座って、こちらを向く） -->
          <path d="M44 60 L60 60 L59 68 L45 68Z" fill="url(#bpSkin)"/>
          <path d="M36 80 Q37 68 52 66 Q67 68 68 80 L68 112 Q66 124 52 126 Q38 124 36 112Z" fill="url(#bpSkin)"/>
          <!-- 青いビキニ -->
          <path d="M38 80 Q44 75 51 81 Q58 75 66 80 Q66 89 59 91 Q53 92 51 87 Q49 92 44 91 Q38 89 38 80Z" fill="#1f4fc0"/>
          <path d="M43 78 L45 68 M61 78 L59 68" stroke="#1f4fc0" stroke-width="1.3"/>
          <path d="M38 114 Q52 120 67 114 L66 123 Q52 128 39 123Z" fill="#1f4fc0"/>
          <!-- 脚：ひざを右にそろえて立て、すねはプールサイドへ -->
          <path d="M44 118 Q70 108 96 106 Q103 107 102 114 Q76 122 52 130Z" fill="url(#bpSkin)"/>
          <path d="M94 106 Q101 104 103 112 L98 150 Q92 152 89 148Z" fill="url(#bpSkin)"/>
          <path d="M50 124 Q72 120 88 124 Q91 129 86 131 L54 134Z" fill="#e2ab84"/>
          <path d="M84 124 Q90 122 92 128 L88 154 Q83 156 81 152Z" fill="#e2ab84"/>
          <ellipse cx="94" cy="153" rx="6" ry="2.4" fill="#e9b68f"/><ellipse cx="85" cy="156" rx="5" ry="2.2" fill="#d99f78"/>
          <!-- 左手はひざの上に -->
          <path d="M66 84 Q78 94 92 104" stroke="#f0c39e" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- 右手でジョッキを顔の横に掲げる -->
          <path d="M38 86 Q28 84 26 70" stroke="#f0c39e" stroke-width="6.5" fill="none" stroke-linecap="round"/>
          <rect x="12" y="44" width="22" height="28" rx="3" fill="url(#bpBeer)" stroke="#fff" stroke-width="1.2"/>
          <path d="M12 50 q-8 0 -8 9 t8 9" stroke="#fff" stroke-width="2.6" fill="none"/>
          <path d="M10 46 q3 -8 9 -5 q4 -6 10 -1 q6 -2 6 5 Z" fill="#fffdf3"/>
          <g fill="#fff" opacity=".7"><circle cx="18" cy="60" r="1.2"/><circle cx="25" cy="66" r="1"/><circle cx="28" cy="55" r="1.1"/></g>
          <!-- 顔（少しかしげて、にっこり） -->
          <g transform="rotate(-6 52 40)">
            <ellipse cx="52" cy="40" rx="14" ry="16" fill="#f6cfac"/>
            <path d="M38 38 Q39 20 52 19 Q66 20 67 38 Q62 27 52 29 Q42 27 38 38Z" fill="#2a1a10"/>
            <path d="M45 40 q3 -3 6 0 M54 40 q3 -3 6 0" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="44" cy="46" rx="2.6" ry="1.6" fill="#ff8a8a" opacity=".5"/><ellipse cx="61" cy="46" rx="2.6" ry="1.6" fill="#ff8a8a" opacity=".5"/>
            <path d="M48 49 Q52 54 57 49" stroke="#b3261e" stroke-width="1.6" fill="#fff" stroke-linejoin="round"/>
            <circle cx="66" cy="30" r="2.6" fill="#fff"/><circle cx="68" cy="27" r="1.6" fill="#ffd0e0"/>
          </g>
          <!-- キャッチコピー（縦書きの黒い帯） -->
          <rect x="94" y="6" width="22" height="78" fill="#111"/>
          <g font-size="12" font-weight="bold" fill="#fff" font-family="sans-serif" text-anchor="middle">
            <text x="105" y="21">よ</text><text x="105" y="34">く</text><text x="105" y="47">冷</text><text x="105" y="60">え</text><text x="105" y="73">た</text>
          </g>
          <g font-size="6" fill="#fff" font-family="sans-serif" text-anchor="middle"><text x="105" y="81">、生。</text></g>
          <!-- 商品名（架空） -->
          <rect x="0" y="146" width="120" height="24" fill="#c0201a"/>
          <rect x="84" y="140" width="32" height="12" fill="#c0201a" stroke="#fff" stroke-width=".8"/>
          <text x="100" y="149" font-size="7.5" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">樽生</text>
          <text x="60" y="163" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif" letter-spacing=".5">ラーメン横丁ビール</text>
        </svg>
        </div>
        <div class="beer-poster p2">
        <svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bp2Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e74c9"/><stop offset=".55" stop-color="#8ccaf0"/><stop offset=".55" stop-color="#e6f3f8"/><stop offset=".64" stop-color="#bfe2ef"/><stop offset=".66" stop-color="#e7d1a4"/><stop offset="1" stop-color="#d6b47c"/></linearGradient>
            <linearGradient id="bp2Beer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98a14"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#c97a10"/></linearGradient>
            <linearGradient id="bp2Skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d79c72"/><stop offset=".5" stop-color="#ebba90"/><stop offset="1" stop-color="#cf9268"/></linearGradient>
          </defs>
          <rect width="120" height="170" fill="url(#bp2Sky)"/>
          <path d="M0 92 q15 -5 30 0 t30 0 t30 0 t30 0 V100 H0Z" fill="#fff" opacity=".8"/>
          <!-- 髪（アップ） -->
          <path d="M58 22 Q60 8 74 10 Q86 14 82 30 Q86 44 78 52 L62 50 Q54 40 58 22Z" fill="#2a1a10"/>
          <circle cx="74" cy="10" r="7" fill="#2a1a10"/>
          <!-- 腕（ジョッキを高く掲げる） -->
          <path d="M52 76 Q40 70 38 50" stroke="#e3ad84" stroke-width="7" fill="none" stroke-linecap="round"/>
          <rect x="26" y="20" width="22" height="30" rx="3" fill="url(#bp2Beer)" stroke="#fff" stroke-width="1.4"/>
          <path d="M24 22 q3 -8 9 -5 q4 -6 10 -1 q6 -2 6 5 Z" fill="#fffdf3"/>
          <g fill="#fff" opacity=".7"><circle cx="32" cy="36" r="1.2"/><circle cx="40" cy="42" r="1"/><circle cx="42" cy="30" r="1.1"/></g>
          <!-- 体（砂浜に座る） -->
          <path d="M62 50 L76 50 L75 58 L63 58Z" fill="url(#bp2Skin)"/>
          <path d="M50 76 Q52 60 68 58 Q84 60 86 76 L86 106 Q82 118 68 120 Q52 118 50 106Z" fill="url(#bp2Skin)"/>
          <!-- 白いビキニ -->
          <path d="M52 74 Q59 69 67 75 Q75 69 84 74 Q84 84 76 86 Q70 87 67 82 Q64 87 58 86 Q51 84 52 74Z" fill="#fbfbf8" stroke="#e2e2dc" stroke-width=".6"/>
          <path d="M57 72 L62 58 M79 72 L74 58" stroke="#fbfbf8" stroke-width="1.4"/>
          <path d="M51 108 Q68 114 86 108 L85 118 Q68 124 52 118Z" fill="#fbfbf8" stroke="#e2e2dc" stroke-width=".6"/>
          <!-- 後ろについた腕 -->
          <path d="M85 78 Q96 96 98 120" stroke="#d99c72" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- 脚（ひざを立てて横に流す） -->
          <path d="M52 116 Q34 110 16 118 Q10 124 16 128 Q36 124 56 128Z" fill="url(#bp2Skin)"/>
          <path d="M60 120 Q40 124 26 136 Q24 142 30 142 Q46 136 66 128Z" fill="#d99c72"/>
          <!-- 顔（こちらを向いてにっこり） -->
          <ellipse cx="70" cy="36" rx="13" ry="15" fill="#ebba90"/>
          <path d="M57 34 Q58 18 70 18 Q83 18 83 34 Q78 24 70 26 Q62 24 57 34Z" fill="#2a1a10"/>
          <path d="M63 36 q3 -3 6 0 M72 36 q3 -3 6 0" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="62" cy="42" rx="2.4" ry="1.5" fill="#ff8a8a" opacity=".5"/><ellipse cx="78" cy="42" rx="2.4" ry="1.5" fill="#ff8a8a" opacity=".5"/>
          <path d="M66 45 Q70 50 75 45" stroke="#b3261e" stroke-width="1.6" fill="#fff" stroke-linejoin="round"/>
          <!-- 商品名（架空） -->
          <rect x="0" y="146" width="120" height="24" fill="#f5efe2"/>
          <g font-weight="bold" font-family="sans-serif" text-anchor="middle">
            <text x="30" y="164" font-size="14" fill="#b3261e">横丁</text>
            <rect x="48" y="148" width="24" height="20" rx="3" fill="#1f3fa8"/>
            <text x="60" y="155" font-size="5.5" fill="#fff">樽詰</text>
            <text x="60" y="166" font-size="10" fill="#fff">生</text>
            <text x="94" y="164" font-size="14" fill="#b3261e">ビール</text>
          </g>
        </svg>
        </div>
        <div class="beer-poster p3">
        <svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bp3Sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa38a"/><stop offset=".22" stop-color="#b9bba6"/><stop offset=".22" stop-color="#6fb7d4"/><stop offset=".62" stop-color="#3f97c4"/><stop offset=".66" stop-color="#e9eef0"/><stop offset=".72" stop-color="#cdb184"/><stop offset="1" stop-color="#b8935e"/></linearGradient>
            <linearGradient id="bp3Rainbow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".2" stop-color="#ffa94d"/><stop offset=".4" stop-color="#ffe066"/><stop offset=".6" stop-color="#8ce99a"/><stop offset=".8" stop-color="#74c0fc"/><stop offset="1" stop-color="#f783ac"/></linearGradient>
            <linearGradient id="bp3Skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4ae86"/><stop offset=".5" stop-color="#f2c6a2"/><stop offset="1" stop-color="#dca47c"/></linearGradient>
          </defs>
          <rect width="120" height="170" fill="url(#bp3Sea)"/>
          <g fill="#868a75" opacity=".7"><ellipse cx="18" cy="20" rx="20" ry="14"/><ellipse cx="62" cy="16" rx="22" ry="13"/><ellipse cx="104" cy="22" rx="20" ry="14"/></g>
          <path d="M0 108 q15 -4 30 0 t30 0 t30 0 t30 0 V114 H0Z" fill="#fff" opacity=".85"/>
          <!-- 脚 -->
          <path d="M48 118 L50 160 L59 160 L60 120Z M62 120 L64 160 L73 160 L74 118Z" fill="url(#bp3Skin)"/>
          <!-- 体（うしろ姿） -->
          <path d="M44 62 Q46 52 60 50 Q74 52 76 62 L78 100 Q76 122 60 124 Q44 122 42 100Z" fill="url(#bp3Skin)"/>
          <!-- 虹色の編みワンピース（背中は大きくあいて、ひもがクロス） -->
          <path d="M43 92 Q52 102 60 96 Q68 102 77 92 L78 104 Q76 124 60 126 Q44 124 42 104Z" fill="url(#bp3Rainbow)"/>
          <g stroke="#fff" stroke-width=".5" opacity=".6"><path d="M44 106 L76 106 M43 112 L77 112 M44 118 L76 118"/><path d="M48 98 L52 124 M56 98 L58 126 M64 98 L62 126 M72 98 L68 124"/></g>
          <path d="M46 62 L72 82 M74 62 L48 82" stroke="#fff" stroke-width="1.2"/>
          <path d="M47 60 L52 50 M73 60 L68 50" stroke="#fff" stroke-width="1"/>
          <!-- 腕（片手は振り向きざまに手を振る） -->
          <path d="M44 66 Q38 84 40 100" stroke="#e8b48c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
          <path d="M76 64 Q88 54 92 40" stroke="#e8b48c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
          <rect x="84" y="16" width="18" height="24" rx="3" fill="#ffc63a" stroke="#fff" stroke-width="1.2"/>
          <path d="M82 18 q3 -7 8 -4 q4 -5 9 -1 q5 -1 5 4 Z" fill="#fffdf3"/>
          <ellipse cx="93" cy="40" rx="4.5" ry="4" fill="#f2c6a2"/>
          <!-- 振り向いた顔（肩ごしに笑顔） -->
          <!-- うしろ髪（肩にかかる）。顔は左肩ごしにこちらを向く -->
          <path d="M48 26 Q49 12 62 12 Q76 13 76 26 L74 30 Q64 26 56 34 Q54 46 50 54 Q44 44 48 26Z" fill="#2a1a10"/>
          <ellipse cx="66" cy="34" rx="11" ry="13" fill="#f2c6a2"/>
          <path d="M55 30 Q56 16 66 16 Q76 18 77 30 Q72 22 64 24 Q58 24 55 30Z" fill="#2a1a10"/>
          <path d="M64 34 q2.5 -2.5 5 0 M71 34 q2 -2 4 0" stroke="#2a1a10" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="65" cy="40" rx="2.2" ry="1.4" fill="#ff8a8a" opacity=".5"/>
          <path d="M66 43 Q70 47 74 42" stroke="#b3261e" stroke-width="1.5" fill="#fff" stroke-linejoin="round"/>
          <!-- 商品名（架空） -->
          <rect x="0" y="146" width="120" height="24" fill="#1f3fa8"/>
          <text x="60" y="163" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">夏だ！横丁ビール</text>
          <text x="104" y="140" font-size="5" fill="#fff" text-anchor="middle" font-family="sans-serif">お酒は20歳になってから</text>
        </svg>
        </div>
      </div>
      <div class="harigami" aria-hidden="true">冷やし中華<br>はじめました</div>
    </div>
    <div id="entrance">
      <div class="noren"><span>中</span><span>華</span><span>そ</span><span>ば</span></div>
    </div>
    <!-- 行列：席の後ろに立って並ぶお客さん -->
    <div id="queue"></div>
    <div id="seats"></div>
    <div id="counter"></div>
  </section>

  <!-- 厨房（手前） -->
  <section id="kitchen">
    <div id="toast"></div>
    <!-- リワード広告：怒って帰ったお客さんを呼び戻す（アプリのみ） -->
    <button id="recallBtn" type="button" hidden></button>
    <div class="k-block boiler-block">
      <div id="cups"></div>
      <div id="boilers"></div>
    </div>
    <div class="k-block bowl-block">
      <div id="bowlArea"></div>
    </div>
    <div class="k-block side-block">
      <div id="ingredients"></div>
    </div>
  </section>

  <!-- オーバーレイ -->
  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>

</body>
</html>
