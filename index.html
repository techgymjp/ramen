<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行列のできるラーメン店</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <!-- ヘッダー -->
  <header id="hud">
    <div class="hud-item">🕐 <span id="clock">11:00</span></div>
    <div class="hud-item">💴 <span id="money">¥0</span></div>
    <div class="hud-item">評判 <span id="rep">★★★☆☆</span></div>
    <div class="hud-item">行列 <span id="qcount">0</span>人</div>
    <div class="hud-item">🗑️ <span id="garbage">0</span></div>
    <button id="bgmBtn" class="hud-btn" type="button">🎵 BGM ON</button>
  </header>

  <!-- 客席側（奥） -->
  <section id="shop">
    <div id="menuboard">
      <div class="mb-title">お品書き</div>
      <div id="menulist"></div>
    </div>
    <div id="entrance">
      <div class="noren"><span>ら</span><span>ー</span><span>めん</span></div>
      <div id="queue"></div>
    </div>
    <div id="cups"></div>
    <div id="seats"></div>
    <div id="counter"></div>
  </section>

  <!-- 厨房（手前） -->
  <section id="kitchen">
    <div id="toast"></div>
    <div class="k-block boiler-block">
      <div class="k-label">茹で鍋</div>
      <div id="boilers"></div>
    </div>
    <div class="k-block bowl-block">
      <div class="k-label">どんぶり（タップでスープ → 麺 → 具 → お客さんをタップで出す）</div>
      <div id="bowlArea"></div>
    </div>
    <div class="k-block side-block">
      <div class="k-label">具材（タップでどんぶりへ）</div>
      <div id="ingredients"></div>
    </div>
  </section>

  <!-- オーバーレイ -->
  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="bowl3d.js"></script>
<script src="bgm.js"></script>
<script src="game.js"></script>
</body>
</html>
